# 由 githup App 生成（Android Gradle）· 2026-11-03
# 修改说明（2026-11-03 第3次修订）：
#   1. 新增 "Fetch ShizukuX API" —— api/ 未登记为 git 子模块，checkout 拉不到
#   2. 新增 "Install Rust & cargo-ndk" —— buildRustDebug 需要 cargo ndk 命令，
#      runner 未预装，会导致 "no such command: `ndk`"
#   3. JDK 21
#   4. 构建 :manager:assembleShizukuxDebug（双 flavor 需指定）
#   5. 产物精确路径上传

name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 安装包名称（仅用作 artifact 名称）
        default: 'ShizukuX'
      version_name:
        description: 版本号（仅用于 artifact 命名）
        default: 'custom'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Fetch ShizukuX API
        run: |
          rm -rf api
          git clone --depth 1 https://github.com/qianyumeng0228/ShizukuX-API.git api
          for d in aidl rish shared api provider server-shared; do
            if [ -d "api/$d" ]; then echo "OK      api/$d"; else echo "MISSING api/$d"; exit 1; fi
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # buildRustDebug 需要 cargo ndk，runner 未预装
      - name: Install Rust & cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk --locked
          cargo ndk --version

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Accept SDK Licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Build Debug APK
        run: ./gradlew :manager:assembleShizukuxDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-${{ github.event.inputs.version_name }}
          path: manager/build/outputs/apk/shizukux/debug/*.apk
          if-no-files-found: error