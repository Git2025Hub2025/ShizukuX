# 由 githup App 生成（Android Gradle）· 2026-11-03
# 修改说明（2026-11-03 修订）：
#   1. submodules 改为 recursive —— 项目有子模块，缺子模块源码会导致编译失败
#   2. JDK 17 → 21 —— 与仓库原有 app.yml 一致，AGP 要求
#   3. 删除 "Set version" 步骤 —— 原来的 sed 会破坏 build.gradle 的跨行闭包
#      (versionCode { ... }())，导致 "Unexpected input: '}'" 配置阶段失败；
#      版本号由项目自身的 baseVersionName + git commit 计数机制处理即可
#   4. 构建目标改为 :manager:assembleShizukuxDebug —— 项目是 shizukux/dropin
#      双 flavor，直接 assembleDebug 会因 flavor 歧义失败
#   5. 删除 "Rename APK" 步骤，产物用精确路径上传，避免 find 抓到错误文件

name: Build APK

on:
  workflow_dispatch:   # 允许在 App 里点「手动触发构建」
    inputs:
      app_name:
        description: 安装包名称（仅用作 artifact 名称）
        default: 'ShizukuX'
      version_name:
        description: 版本号（仅用于 artifact 命名，不影响 APK 内版本）
        default: 'custom'

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub 免费提供的 Linux 构建机
    steps:
      # 1. 拉取仓库，必须包含子模块
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      # 2. JDK 21（与仓库原有 app.yml 一致）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Gradle 缓存，加速后续构建
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. gradlew 必须可执行
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. 接受 Android SDK 许可
      - name: Accept SDK Licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      # 6. 构建 Debug APK（shizukux flavor，可与原版 Shizuku 共存）
      - name: Build Debug APK
        run: ./gradlew :manager:assembleShizukuxDebug --no-daemon --stacktrace

      # 7. 上传产物：精确路径，避免抓到错误文件
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-${{ github.event.inputs.version_name }}
          path: manager/build/outputs/apk/shizukux/debug/*.apk
          if-no-files-found: error