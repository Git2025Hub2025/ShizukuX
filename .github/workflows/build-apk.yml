# 由 githup App 生成（Android Gradle）· 2026-11-03
# 修改说明（2026-11-03 第2次修订）：
#   1. 新增 "Fetch ShizukuX API" 步骤 —— 仓库里的 api/ 目录没有登记为 git 子模块
#      （index 中缺少 gitlink），所以 actions/checkout 的 submodules:recursive
#      实际什么都拉不到，导致 settings.gradle 找不到 :rish / :aidl / :shared /
#      :api / :provider / :server-shared。改为把 API 仓库直接 clone 到 api/。
#   2. 保留 submodules:recursive（无害，若日后正式登记子模块会自动生效）
#   3. JDK 21（与仓库原有 app.yml 一致）
#   4. 构建 :manager:assembleShizukuxDebug（项目是 shizukux/dropin 双 flavor）
#   5. 产物用精确路径上传

name: Build APK

on:
  workflow_dispatch:   # 允许在 App 里点「手动触发构建」
    inputs:
      app_name:
        description: 安装包名称（仅用作 artifact 名称）
        default: 'ShizukuX'
      version_name:
        description: 版本号（仅用于 artifact 命名，不影响 APK 内版本）
        default: 'custom'

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub 免费提供的 Linux 构建机
    steps:
      # 1. 拉取仓库（submodules 为兜底，主仓库未登记 gitlink 时拉不到东西）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      # 2. 手动拉取 API 依赖仓库到 api/（关键步骤）
      - name: Fetch ShizukuX API
        run: |
          rm -rf api
          git clone --depth 1 https://github.com/qianyumeng0228/ShizukuX-API.git api
          echo "=== api/ 内容 ==="
          ls -1 api/
          echo "=== 校验 6 个必需子项目 ==="
          for d in aidl rish shared api provider server-shared; do
            if [ -d "api/$d" ]; then echo "OK      api/$d"; else echo "MISSING api/$d"; exit 1; fi
          done

      # 3. JDK 21（与仓库原有 app.yml 一致）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Gradle 缓存，加速后续构建
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. gradlew 必须可执行
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 6. 接受 Android SDK 许可
      - name: Accept SDK Licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      # 7. 构建 Debug APK（shizukux flavor，可与原版 Shizuku 共存）
      - name: Build Debug APK
        run: ./gradlew :manager:assembleShizukuxDebug --no-daemon --stacktrace

      # 8. 上传产物：精确路径，避免抓到错误文件
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-${{ github.event.inputs.version_name }}
          path: manager/build/outputs/apk/shizukux/debug/*.apk
          if-no-files-found: error